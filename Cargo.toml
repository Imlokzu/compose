[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/gpui"]

[workspace.package]
version = "0.13.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
parley = "=0.11.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
unicode-segmentation = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
smallvec = "1"
tempfile = "3"
sha2 = "0.10"
text = { path = "crates/text" }
document = { path = "crates/document" }
layout = { path = "crates/layout" }
editor = { path = "crates/editor" }
file_format = { path = "crates/file_format" }
renderer = { path = "crates/renderer" }
export = { path = "crates/export" }

[patch.crates-io]
gpui = { path = "vendor/gpui" }

[profile.dev]
debug = false
incremental = false

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
debug = false
strip = true
