name: Native desktop builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  background-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p compose-background-service -p image_tools --locked
      - run: docker build -f services/background/Dockerfile -t compose-background-service .
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Locate the Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK shader compiler not found' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Test document engine and portable cloud API
        run: cargo test --workspace --locked
      - name: Build optimized native desktop app
        run: cargo build -p compose --release --locked
      - name: Verify packaged document engine on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process ./target/release/compose.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Compose-Windows
          path: |
            dist/Compose-Windows.zip
            dist/Compose-Windows.zip.sha256
          if-no-files-found: error
