[package]
name = "compose-background-service"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
image_tools = { path = "../image_tools" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }

[dev-dependencies]
image.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
